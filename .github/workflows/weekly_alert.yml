name: Weekly PubMed alert

on:
  schedule:
    # Mondays at 07:00 UTC (= 08:00 Madrid winter, 09:00 Madrid summer)
    - cron: "0 7 * * 1"
  workflow_dispatch:  # allows manual runs from the Actions tab

jobs:
  alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit seen_pmids.json back
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PubMed alert
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python pubmed_alert.py

      - name: Commit updated seen_pmids.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_pmids.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update seen PMIDs ($(date -u +%Y-%m-%d))"
            git push
          fi
